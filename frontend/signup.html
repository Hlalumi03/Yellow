<section class="card auth-card border-0">
  <div class="card-body p-4 p-md-5">
    <p class="auth-eyebrow mb-2">JOIN THE COMMUNITY</p>
    <h2 class="h3 mb-4">Create your account</h2>
    {{notice}}
    <form method="post" action="/signup">
      <input type="hidden" name="csrf_token" value="{{csrf_token}}">
      <div class="row g-3">
        <div class="col-sm-6">
          <label class="form-label" for="name">Name</label>
          <input class="form-control" id="name" name="name" autocomplete="given-name"
                 maxlength="80" required value="{{name}}">
        </div>
        <div class="col-sm-6">
          <label class="form-label" for="surname">Surname</label>
          <input class="form-control" id="surname" name="surname" autocomplete="family-name"
                 maxlength="80" required value="{{surname}}">
        </div>
        <div class="col-12">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" id="email" name="email" type="email"
                 autocomplete="email" maxlength="254" required value="{{email}}">
        </div>
        <div class="col-12">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" id="password" name="password" type="password"
                 autocomplete="new-password" minlength="8" maxlength="1024" required>
          <div class="form-text">Use at least 8 characters.</div>
        </div>
        <div class="col-12 d-grid mt-4">
          <button class="btn btn-primary btn-lg" type="submit">Sign up</button>
        </div>
      </div>
    </form>
    <p class="text-center text-body-secondary mt-4 mb-0">
      Already have an account? <a href="/signin">Sign in</a>
    </p>
  </div>
</section>
