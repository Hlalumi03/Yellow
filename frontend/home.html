<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home - Yellow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/style.css" rel="stylesheet">
</head>
<body class="home-page">
  <header class="home-header">
    <span class="home-user-name">Hi, {{name}}</span>
    <div class="home-account">
      <a class="home-brand" href="/account" aria-label="Yellow home">
        <span class="home-brand-mark" aria-hidden="true">Y</span>
        Yellow
      </a>
      <form method="post" action="/logout">
        <input type="hidden" name="csrf_token" value="{{csrf_token}}">
        <button class="btn btn-sm home-signout" type="submit">Sign out</button>
      </form>
    </div>
  </header>
  <main class="container home-content">
    <section class="home-welcome">
      <span class="home-kicker">YOUR SPACE, YOUR NEXT CHAPTER</span>
      <h1>Welcome, {{name}}!</h1>
      <p>You’re all signed in. It’s great to have you here.</p>
      <div class="home-email">
        <span class="home-email-icon" aria-hidden="true">@</span>
        <div>
          <span class="home-email-label">SIGNED IN AS</span>
          <strong>{{email}}</strong>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
