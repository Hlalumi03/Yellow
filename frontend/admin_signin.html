<section class="card auth-card border-0">
  <div class="card-body p-4 p-md-5">
    <p class="auth-eyebrow mb-2">STORE MANAGEMENT</p>
    <h2 class="h3 mb-4">Administrator sign in</h2>
    {{notice}}
    <form method="post" action="/admin/signin">
      <input type="hidden" name="csrf_token" value="{{csrf_token}}">
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" id="email" name="email" type="email"
               autocomplete="email" maxlength="254" required>
      </div>
      <div class="mb-4">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password"
               autocomplete="current-password" maxlength="1024" required>
      </div>
      <div class="d-grid">
        <button class="btn btn-primary btn-lg" type="submit">Sign in</button>
      </div>
    </form>
    <p class="text-center text-body-secondary mt-4 mb-0">
      Customer? <a href="/signin">Sign in to shop</a>
    </p>
  </div>
</section>
